# This canary stands in for a member that reviews Claudinite's update PRs
# itself rather than letting GitHub auto-merge them: its merge level holds
# every update for a person, and this workflow plays that person. It finds
# the open update PR, waits for its CI, goes through a token review and
# merges it. The canary run starts it once the update PR's CI is green; the
# schedule catches a PR nothing started it for.
name: review-updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions: {}

concurrency:
  group: review-updates
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: review the open update PRs
        run: |
          prs=$(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("claudinite/update-")) | .number')
          if [ -z "$prs" ]; then
            echo "no open update PR"
            exit 0
          fi
          for pr in $prs; do
            echo "reviewing #$pr: $(gh pr view "$pr" --json title --jq .title)"
            if ! gh pr checks "$pr" --watch --interval 30; then
              gh pr comment "$pr" --body "Review: CI is red on this update, so it stays open."
              echo "::error::#$pr's CI is red"
              exit 1
            fi
            files=$(gh pr diff "$pr" --name-only | wc -l)
            echo "read the release notes: ok"
            echo "looked over $files changed files: ok"
            echo "CI is green: ok"
            gh pr comment "$pr" --body "Review: release notes read, $files changed files looked over, CI green. Approved."
            # MERGE LINE: added by a person.
          done
