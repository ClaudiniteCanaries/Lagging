# The adopted canary. This repo is a fleet member on the staging distro
# whose own weekly update, or a pass the fleet manager forces, moves its pin
# besides this run. A Claudinite engine release dispatches it with the version it just published. It brings the
# packs up to date first, then runs this repo's ordinary engine update (cn update engine, as the engine/update
# task does) until that version lands. It passes when the update PR opens
# for the version, its CI goes green and it merges, then cn selftest --repo
# passes on the new main and cn check world reports no finding, deprecations
# aside, that it did not report before the update. When it fails, the report
# job opens a release-blocker issue naming the version in this repo, or
# comments on the one already open, which holds the release back from
# promotion to stable.
name: canary

on:
  workflow_dispatch:
    inputs:
      version:
        description: The engine version to update to, MAJOR.YMMDD.BUILD
        required: true
        type: string

permissions: {}

concurrency:
  group: canary
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      CLAUDINITE_MANAGER_TOKEN: ${{ secrets.CLAUDINITE_MANAGER_TOKEN }}
    steps:
      - name: the version is MAJOR.YMMDD.BUILD
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.YMMDD.BUILD, not \"$VERSION\""
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: download the pinned engine
        run: |
          { npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; }
      # An engine that has the installer-run update (cn update run) takes
      # engine and packs in one PR; an older one takes today's two updates.
      - name: which update the pinned engine runs
        id: flow
        run: |
          # cn with no command exits non-zero, which pipefail would carry.
          usage=$(.claudinite/bin/cn 2>&1 || true)
          if grep -q '^  update run ' <<< "$usage"; then
            echo new=true >> "$GITHUB_OUTPUT"
          else
            echo new=false >> "$GITHUB_OUTPUT"
          fi
      # The engine is judged against the packs as they are now: a pack fix
      # this repo has not taken would fail selftest and stop the engine
      # update before it starts.
      - name: update the packs
        if: steps.flow.outputs.new != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 30 * 60))
          pr=''
          while :; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            if [ -n "$pr" ] && [ "$(gh pr view "$pr" --json state --jq .state)" = MERGED ]; then
              echo "#$pr merged"
              break
            fi
            verdict=$(.claudinite/bin/cn update packs | tail -n 1)
            echo "cn update packs: $verdict"
            case $verdict in
              "up to date" | "landed "*)
                break ;;
              "opened #"*)
                pr=${verdict#opened #}
                pr=${pr%% *} ;;
              "skipped: #"*" is open and its CI concluded "*)
                echo "::error::the pack update PR's CI is red: $verdict"
                exit 1 ;;
              "skipped: #"*" is open and "*)
                pr=${verdict#skipped: #}
                pr=${pr%% *} ;;
              "skipped: main has no CI run yet"* | "skipped: main is not green (queued)" | "skipped: main is not green (in_progress)" \
                | "skipped: main is not green (waiting)" | "skipped: main is not green (pending)" | "skipped: main is not green (requested)")
                ;;
              *)
                echo "::error::the pack update stopped at: $verdict"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the packs had not landed after 30 minutes; the last verdict was: $verdict"
              exit 1
            fi
            sleep 30
          done
      # The findings, not the exit code, are what the run after the update
      # is compared with, so a failing check world here does not stop it.
      - name: findings before the update
        run: |
          .claudinite/bin/cn check world > "$RUNNER_TEMP/before.txt" || true
          cat "$RUNNER_TEMP/before.txt"
      # Each cn update engine acts at most once: it waits for main's CI,
      # opens the update PR and starts its CI, or lands a green one. Its
      # PR's own CI run lands it too, so a merged PR ends the loop as well.
      - name: update the engine to the version
        if: steps.flow.outputs.new != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 90 * 60))
          listed=$((SECONDS + 10 * 60))
          pr=''
          while :; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            if [ -n "$pr" ] && [ "$(gh pr view "$pr" --json state --jq .state)" = MERGED ]; then
              echo "#$pr merged"
              break
            fi
            verdict=$(.claudinite/bin/cn update engine | tee -a "$RUNNER_TEMP/update.log" | tail -n 1)
            echo "cn update engine: $verdict"
            case $verdict in
              "landed $VERSION")
                break ;;
              "up to date")
                if [ "$({ npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; } | sed -n 1p)" = "$VERSION" ]; then
                  break
                fi
                # npm's package listing can lag the publish by minutes.
                if [ "$SECONDS" -lt "$listed" ]; then
                  echo "npm does not list $VERSION yet; trying again"
                else
                  echo "::error::cn update engine reports up to date, but main does not pin $VERSION"
                  exit 1
                fi ;;
              "opened #"*" for $VERSION")
                pr=${verdict#opened #}
                pr=${pr%% *} ;;
              *"agent stage"*)
                echo "::error::the update PR for $VERSION changes .github/workflows/, which only the engine/update task's agent stage may merge, and this canary runs none: $verdict"
                exit 1 ;;
              "skipped: #"*" for $VERSION is open and its CI concluded "*)
                echo "::error::the update PR's CI is red: $verdict"
                exit 1 ;;
              "skipped: #"*" for $VERSION is open and "*)
                pr=${verdict#skipped: #}
                pr=${pr%% *} ;;
              "skipped: main has no CI run yet"* | "skipped: main is not green (queued)" | "skipped: main is not green (in_progress)" \
                | "skipped: main is not green (waiting)" | "skipped: main is not green (pending)" | "skipped: main is not green (requested)")
                ;;
              *)
                echo "::error::the update to $VERSION stopped at: $verdict"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$VERSION had not landed after 90 minutes; the last verdict was: $verdict"
              exit 1
            fi
            sleep 30
          done
      # The new engine's update opens one PR for engine and packs and never
      # merges it: GitHub's auto-merge does once its required check passes,
      # as this repo's merge level allows.
      - name: update through the installer
        if: steps.flow.outputs.new == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 90 * 60))
          listed=$((SECONDS + 10 * 60))
          while :; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            if [ "$(sed -n 's/^  version: "\(.*\)"$/\1/p' .claudinite/settings.yaml | head -n 1)" = "$VERSION" ]; then
              echo "main pins $VERSION"
              break
            fi
            verdict=$(.claudinite/bin/cn update run | tee -a "$RUNNER_TEMP/update.log" | grep '^update: ' | tail -n 1)
            echo "cn update run: $verdict"
            case $verdict in
              "update: opened #"*"engine $VERSION"* | "update: refreshed #"*"engine $VERSION"* | "update: #"*"engine $VERSION"*" is open and current")
                pr=${verdict#update: }
                pr=${pr#opened }
                pr=${pr#refreshed }
                pr=${pr#\#}
                pr=${pr%% *}
                for _ in $(seq 20); do
                  [ "$(gh pr checks "$pr" --json name --jq length 2>/dev/null || echo 0)" -gt 0 ] && break
                  sleep 15
                done
                if ! gh pr checks "$pr" --watch --interval 30; then
                  echo "::error::the update PR #$pr's CI is red"
                  exit 1
                fi
                # This repo's merge level holds the update for a person;
                # review-updates is that person.
                gh workflow run review-updates.yml
                for _ in $(seq 40); do
                  [ "$(gh pr view "$pr" --json state --jq .state)" = MERGED ] && break
                  sleep 15
                done ;;
              "update: up to date")
                if [ "$SECONDS" -ge "$listed" ]; then
                  echo "::error::cn update run reports up to date, but main does not pin $VERSION"
                  exit 1
                fi
                echo "the channel does not list $VERSION yet; trying again" ;;
              *)
                echo "::error::the update to $VERSION stopped at: $verdict"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$VERSION had not landed after 90 minutes; the last verdict was: $verdict"
              exit 1
            fi
            sleep 30
          done
      - name: main pins the version
        run: |
          git fetch -q origin main
          git reset -q --hard FETCH_HEAD
          pinned=$({ npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; } | sed -n 1p)
          if [ "$pinned" != "$VERSION" ]; then
            echo "::error::main pins $pinned after the update, not $VERSION"
            exit 1
          fi
      - name: cn selftest --repo
        run: .claudinite/bin/cn selftest --repo .
      # The new engine's own update, as its engine/update task runs it: the
      # installer finds the pin current and runs that engine's apply, here
      # writing nothing. An engine without apply ends the run here.
      - name: the installer's update on the new engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx --yes @claudinite/setup@1 update --repo . --dry-run --json > "$RUNNER_TEMP/apply.json"
          cat "$RUNNER_TEMP/apply.json"
          to=$(jq -r .to "$RUNNER_TEMP/apply.json")
          if [ "$to" != "$VERSION" ]; then
            echo "::error::the installer's update ran an engine reporting $to, not $VERSION"
            exit 1
          fi
      # A finding is keyed by its class, check and path, the line up to its
      # sentence, so a sentence naming the engine version does not read as
      # new.
      - name: no new finding in cn check world
        if: ${{ !cancelled() }}
        run: |
          .claudinite/bin/cn check world > "$RUNNER_TEMP/after.txt" || true
          cat "$RUNNER_TEMP/after.txt"
          # A run with no finding is a clean one, so grep matching nothing is no error.
          keys() { grep -E '^(break|finding|advisory) ' "$1" | sed 's/: .*//' | sort -u || true; }
          new=$(comm -13 <(keys "$RUNNER_TEMP/before.txt") <(keys "$RUNNER_TEMP/after.txt"))
          if [ -n "$new" ]; then
            echo "::error::cn check world on $VERSION reports findings it did not report before the update:"
            echo "$new"
            exit 1
          fi

  # The fleet manager canary's archive scenario needs history to import on
  # every release. The archive deletes the member's conversation-logs branch
  # once it holds every capture, so this job recreates it from the committed
  # fixtures when it is absent: four captures in three commits, the first
  # pruned from the tip so only the history holds it.
  seed:
    name: seed conversation-logs fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: seed the conversation-logs branch
        run: .github/scripts/seed-fixtures.sh conversation-logs
      - name: seed the agent-sessions branch
        run: .github/scripts/seed-fixtures.sh agent-sessions

  # S-11. Today's plaintext logs, kept on purpose: the settings say
  # localPlaintext and still spell the retention the old way
  # (retention_days on the pack entry). A capture lands as plain JSONL on
  # agent-sessions, and the prune task squashes that branch to the window
  # without touching conversation-logs. The fleet manager canary's archive
  # reads both branches, so this waits for it to delete conversation-logs
  # (it is the archive's last act), or for the deadline, before it prunes.
  plaintext:
    name: S-11 plaintext history
    needs: [canary, seed]
    if: ${{ !cancelled() && needs.canary.result != 'skipped' && needs.seed.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: write
      contents: write
      issues: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: download the engine main pins
        run: |
          pinned=$({ npx --yes @claudinite/setup@1.0.1 >&2 && .claudinite/bin/cn version; } | sed -n 1p)
          if [ "$pinned" != "$VERSION" ]; then
            echo "::error::main pins $pinned, not $VERSION: the update did not land"
            exit 1
          fi
      - name: S-11 the archive is done with the fixture branches
        run: |
          # The archive deletes conversation-logs once it holds every capture.
          deadline=$((SECONDS + 100 * 60))
          while git ls-remote --exit-code --heads origin conversation-logs > /dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::notice::the deadline passed with conversation-logs still there; going on without the archive's leave"
              break
            fi
            sleep 60
          done
          # The manager's S-04 compares this repo's agent-sessions head with the
          # one it saw before the archive, right after the branches go.
          sleep 300
      - name: S-11 the old retention spelling is read and the fixtures are in place
        run: |
          .claudinite/bin/cn verify > "$RUNNER_TEMP/verify.txt" || true
          cat "$RUNNER_TEMP/verify.txt"
          grep -q 'growth-retention-spelling' "$RUNNER_TEMP/verify.txt" || {
            echo "::error::cn verify does not read retention_days on the pack entry as the legacy spelling"
            exit 1
          }
          .github/scripts/seed-fixtures.sh conversation-logs
          .github/scripts/seed-fixtures.sh agent-sessions
          git fetch -q origin conversation-logs agent-sessions
          git rev-parse origin/conversation-logs > "$RUNNER_TEMP/logs-before"
      # A capture 5 days old is past the 3 days retention_days says and inside
      # the 10 days the engine falls back to: it goes only if the old spelling
      # is honoured.
      - name: S-11 start from the seeded agent-sessions
        run: |
          git fetch -q origin agent-sessions
          rm -rf "$RUNNER_TEMP/as-reset" && git worktree add -q --detach "$RUNNER_TEMP/as-reset" origin/agent-sessions
          cp .claudinite/canary-fixtures/agent-sessions/*.jsonl "$RUNNER_TEMP/as-reset/"
          cd "$RUNNER_TEMP/as-reset"
          keep=$(for f in "$GITHUB_WORKSPACE"/.claudinite/canary-fixtures/agent-sessions/*.jsonl; do basename "$f"; done)
          for f in $(git ls-files); do
            grep -qxF "$f" <<<"$keep" || git rm -q -- "$f"
          done
          git add .
          if ! git diff --cached --quiet; then
            git -c user.name=claudinite-canary -c user.email=canary@users.noreply.github.com commit -q -m "back to the seeded fixture"
            git push -q origin HEAD:agent-sessions
          fi
      - name: S-11 captures land as plain JSONL on agent-sessions
        run: |
          stale=$(date -u -d '5 days ago' +%Y-%m-%dT%H%MZ)
          rm -rf "$RUNNER_TEMP/as" && git worktree add -q --detach "$RUNNER_TEMP/as" origin/agent-sessions
          (
            cd "$RUNNER_TEMP/as"
            printf '%s\n' '{"type":"user","timestamp":"2026-10-20T08:00:00.000Z","message":{"role":"user","content":"canary stale capture of Lagging"}}' > "$stale--issue-0--canary-stale.jsonl"
            git add .
            git -c user.name=claudinite-canary -c user.email=canary@users.noreply.github.com commit -q -m "stale fixture capture"
            git push -q origin HEAD:agent-sessions
          )
          .claudinite/bin/cn growth capture --issue 0 --session "canary-lagging-$VERSION-$GITHUB_RUN_ID" \
            --transcript .claudinite/canary-fixtures/session.jsonl | tee "$RUNNER_TEMP/capture.txt"
          grep -q 'on agent-sessions' "$RUNNER_TEMP/capture.txt" || {
            echo "::error::the capture did not report a file stored on agent-sessions"
            exit 1
          }
          git fetch -q origin agent-sessions
          new=$(git ls-tree -r --name-only origin/agent-sessions | grep -- "--issue-0--canary-lagging-$VERSION-$GITHUB_RUN_ID" || true)
          if [ -z "$new" ]; then
            echo "::error::agent-sessions holds no capture of this session"
            exit 1
          fi
          git show "origin/agent-sessions:$new" | grep -q 'canary-fixture-marker' || {
            echo "::error::the capture on agent-sessions is not plain JSONL of the fixture"
            exit 1
          }
          echo "$new" > "$RUNNER_TEMP/new-capture"
      - name: S-11 the prune squashes agent-sessions to the window
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          created=$(.claudinite/bin/cn work create engine/logs-prune)
          echo "$created"
          number=$(sed -n 's/^created #\([0-9]*\) .*/\1/p' <<<"$created")
          if [ -z "$number" ]; then
            echo "::error::cn work create did not report the item it filed"
            exit 1
          fi
          gh workflow run claudinite-executor.yml --repo "$GITHUB_REPOSITORY"
          deadline=$((SECONDS + 30 * 60))
          while :; do
            sleep 30
            labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq '[.labels[].name] | join(" ")')
            case " $labels " in
              *" task:status:done "*)
                echo "engine/logs-prune #$number done"
                break ;;
              *" task:status:needs-human-"* | *" task:status:rejected "*)
                echo "::error::engine/logs-prune #$number stopped at: $labels"
                exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the deadline passed before the prune item was done; #$number carries: $labels"
              exit 1
            fi
          done
          git fetch -q origin agent-sessions conversation-logs
          commits=$(git rev-list --count origin/agent-sessions)
          files=$(git ls-tree -r --name-only origin/agent-sessions | grep -v '^README' || true)
          echo "agent-sessions: $commits commit(s) holding: $files"
          if [ "$commits" != 1 ]; then
            echo "::error::the prune left agent-sessions with $commits commits, not one"
            exit 1
          fi
          if [ "$files" != "$(cat "$RUNNER_TEMP/new-capture")" ]; then
            echo "::error::agent-sessions should hold only this run's capture after the prune"
            exit 1
          fi
          if [ "$(git rev-parse origin/conversation-logs)" != "$(cat "$RUNNER_TEMP/logs-before")" ]; then
            echo "::error::the prune moved conversation-logs"
            exit 1
          fi
      # The fleet manager's archive imports this plaintext capture on the next
      # release, so the branch goes back to the capture it is seeded with.
      - name: S-11 put the seeded capture back
        if: ${{ always() }}
        run: |
          git fetch -q origin agent-sessions
          rm -rf "$RUNNER_TEMP/as-restore" && git worktree add -q --detach "$RUNNER_TEMP/as-restore" origin/agent-sessions
          cp .claudinite/canary-fixtures/agent-sessions/*.jsonl "$RUNNER_TEMP/as-restore/"
          cd "$RUNNER_TEMP/as-restore"
          git add .
          if ! git diff --cached --quiet; then
            git -c user.name=claudinite-canary -c user.email=canary@users.noreply.github.com commit -q -m "fixture capture"
            git push -q origin HEAD:agent-sessions
          fi

  report:
    needs: [canary, seed, plaintext]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: open or update the release-blocker issue
        run: |
          title="Release $VERSION fails the adopted canary"
          body="The adopted canary failed for engine $VERSION: $RUN

          Promotion to stable skips $VERSION while this issue is open. Close it once the failure is understood and either fixed in a later release or judged not to block this one."
          gh label create release-blocker --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "Holds a release back from promotion to stable"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-blocker --state open --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | first | .number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label release-blocker --body "$body"
          fi
